<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="600" height="900" fill="#0a1a2e" rx="8"/>
  <text x="300" y="28" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle">核心科技升级路线</text>
  <text x="300" y="48" fill="#7baaaa" font-size="10" text-anchor="middle">《深海迷航2》抢先体验版 · 从坠毁到深海</text>

  <!-- Tier 1: 基础生存 -->
  <text x="20" y="78" fill="#7baaaa" font-size="11" font-weight="bold">▸ 第一层：基础生存</text>

  <g transform="translate(20, 88)">
    <rect x="0" y="0" width="170" height="52" rx="6" fill="rgba(0,212,255,0.1)" stroke="#00d4ff" stroke-width="1"/>
    <text x="85" y="20" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">🔍 扫描仪</text>
    <text x="85" y="36" fill="#7baaaa" font-size="9" text-anchor="middle">钛×2 + 石英×2 + 电池×1</text>
  </g>
  <g transform="translate(210, 88)">
    <rect x="0" y="0" width="170" height="52" rx="6" fill="rgba(200,200,200,0.08)" stroke="#888" stroke-width="1"/>
    <text x="85" y="20" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">🔧 多功能生存工具</text>
    <text x="85" y="36" fill="#7baaaa" font-size="9" text-anchor="middle">初始装配台制作</text>
  </g>
  <g transform="translate(400, 88)">
    <rect x="0" y="0" width="170" height="52" rx="6" fill="rgba(200,200,200,0.08)" stroke="#888" stroke-width="1"/>
    <text x="85" y="20" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">🏊 基础脚蹼</text>
    <text x="85" y="36" fill="#7baaaa" font-size="9" text-anchor="middle">橡胶×2 + 纤维×2</text>
  </g>

  <!-- Arrow T1→T2 -->
  <g stroke="#ffaa40" stroke-width="1.5" stroke-dasharray="4,3">
    <line x1="105" y1="140" x2="105" y2="162"/>
    <line x1="295" y1="140" x2="295" y2="162"/>
  </g>

  <!-- Tier 2: 探索准备 -->
  <text x="20" y="178" fill="#7baaaa" font-size="11" font-weight="bold">▸ 第二层：探索准备</text>

  <g transform="translate(20, 188)">
    <rect x="0" y="0" width="260" height="52" rx="6" fill="rgba(255,170,40,0.12)" stroke="#ffaa40" stroke-width="1.5"/>
    <text x="130" y="20" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">🔨 栖息所建造器</text>
    <text x="130" y="36" fill="#7baaaa" font-size="9" text-anchor="middle">钛×2 + 玻璃×1 + 电池×1 + 铜线×1</text>
  </g>
  <g transform="translate(300, 188)">
    <rect x="0" y="0" width="270" height="52" rx="6" fill="rgba(200,200,200,0.08)" stroke="#888" stroke-width="1"/>
    <text x="135" y="20" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">🫧 标准O₂气瓶 → 大容量O₂</text>
    <text x="135" y="36" fill="#7baaaa" font-size="9" text-anchor="middle">钛×2+橡胶×1+银×2 → +塑钢锭×1</text>
  </g>

  <!-- Arrow T2→T3 -->
  <g stroke="#00d4ff" stroke-width="2">
    <line x1="150" y1="240" x2="150" y2="268"/>
    <polygon points="150,275 145,265 155,265" fill="#00d4ff"/>
  </g>

  <!-- Tier 3: 载具 -->
  <text x="20" y="290" fill="#7baaaa" font-size="11" font-weight="bold">▸ 第三层：载具获取</text>

  <g transform="translate(20, 300)">
    <rect x="0" y="0" width="550" height="65" rx="6" fill="rgba(0,180,220,0.12)" stroke="#00d4ff" stroke-width="2"/>
    <text x="275" y="20" fill="#00d4ff" font-size="13" font-weight="bold" text-anchor="middle">🛵 蝌蚪号 (Tadpole) — 扫描3个碎片解锁</text>
    <text x="275" y="38" fill="#fff" font-size="10" text-anchor="middle">钛锭×2 + 玻璃×1 + 系统芯片×1 + 动力电池×1</text>
    <text x="275" y="54" fill="#7baaaa" font-size="9" text-anchor="middle">下潜 250m → 升级至 400m+ | 侦查型 / 运输型底盘可选</text>
  </g>

  <!-- Branch -->
  <g stroke="#ffaa40" stroke-width="1.5">
    <line x1="200" y1="365" x2="200" y2="388"/>
    <line x1="350" y1="365" x2="350" y2="388"/>
  </g>

  <!-- Tier 4: 升级 -->
  <text x="20" y="405" fill="#7baaaa" font-size="11" font-weight="bold">▸ 第四层：载具升级 + 基因改造</text>

  <g transform="translate(20, 415)">
    <rect x="0" y="0" width="260" height="78" rx="6" fill="rgba(0,230,118,0.1)" stroke="#00e676" stroke-width="1.5"/>
    <text x="130" y="18" fill="#00e676" font-size="12" font-weight="bold" text-anchor="middle">🔧 蝌蚪号升级模块</text>
    <text x="130" y="34" fill="#fff" font-size="9" text-anchor="middle">深潜Mk.1: 天青石×3+珐琅玻璃×2+系统芯片×1</text>
    <text x="130" y="50" fill="#fff" font-size="9" text-anchor="middle">深潜Mk.2: 专用核心×2+陨铁×2+锰合金锭×2</text>
    <text x="130" y="66" fill="#7baaaa" font-size="8" text-anchor="middle">光伏充电·静默推进·撞击装甲</text>
  </g>
  <g transform="translate(310, 415)">
    <rect x="0" y="0" width="260" height="78" rx="6" fill="rgba(200,100,255,0.1)" stroke="#c864ff" stroke-width="1.5"/>
    <text x="130" y="18" fill="#c864ff" font-size="12" font-weight="bold" text-anchor="middle">🧬 基因改造（适应能力）</text>
    <text x="130" y="34" fill="#fff" font-size="9" text-anchor="middle">耐压适应 → 600m深度</text>
    <text x="130" y="50" fill="#fff" font-size="9" text-anchor="middle">消化适应 → 安全吃外星食物</text>
    <text x="130" y="66" fill="#fff" font-size="9" text-anchor="middle">耐热基因 → 进入热液喷口区</text>
  </g>

  <!-- Arrow → Endgame -->
  <g stroke="#ff5252" stroke-width="2">
    <line x1="150" y1="493" x2="150" y2="520"/>
    <line x1="440" y1="493" x2="440" y2="520"/>
    <line x1="150" y1="520" x2="440" y2="520"/>
    <line x1="295" y1="520" x2="295" y2="533"/>
    <polygon points="295,542 290,532 300,532" fill="#ff5252"/>
  </g>

  <!-- Tier 5: 终局 -->
  <text x="20" y="555" fill="#7baaaa" font-size="11" font-weight="bold">▸ 第五层：终局探索</text>

  <g transform="translate(20, 565)">
    <rect x="0" y="0" width="550" height="52" rx="6" fill="rgba(255,82,82,0.12)" stroke="#ff5252" stroke-width="2"/>
    <text x="275" y="20" fill="#ff5252" font-size="12" font-weight="bold" text-anchor="middle">🌋 遗迹废墟 · Axum天文台 · 枯萎边缘 · 收藏家利维坦领地</text>
    <text x="275" y="40" fill="#ffaa40" font-size="9" text-anchor="middle">需要：蝌蚪号深潜升级 · 耐热基因 · 阿克苏姆视野基因 · 高级工具</text>
  </g>

  <!-- 关键矿物速查 -->
  <text x="20" y="648" fill="#7baaaa" font-size="11" font-weight="bold">▸ 关键材料获取顺序</text>

  <g transform="translate(20, 660)">
    <rect x="0" y="0" width="130" height="42" rx="6" fill="rgba(0,230,150,0.1)" stroke="#00e67640"/>
    <text x="65" y="18" fill="#00e676" font-size="10" font-weight="bold" text-anchor="middle">钛·石英·铜·盐</text>
    <text x="65" y="34" fill="#7baaaa" font-size="8" text-anchor="middle">海藻森林·浅水 0-60m</text>
  </g>
  <g transform="translate(160, 660)">
    <rect x="0" y="0" width="130" height="42" rx="6" fill="rgba(0,180,220,0.1)" stroke="#00b4dc40"/>
    <text x="65" y="18" fill="#00d4ff" font-size="10" font-weight="bold" text-anchor="middle">银·铅·金·硫</text>
    <text x="65" y="34" fill="#7baaaa" font-size="8" text-anchor="middle">珊瑚礁带 50-200m</text>
  </g>
  <g transform="translate(300, 660)">
    <rect x="0" y="0" width="130" height="42" rx="6" fill="rgba(255,170,40,0.1)" stroke="#ffaa4040"/>
    <text x="65" y="18" fill="#ffaa40" font-size="10" font-weight="bold" text-anchor="middle">锂·天青石·氯铜矿</text>
    <text x="65" y="34" fill="#7baaaa" font-size="8" text-anchor="middle">热洞·遗迹 200-400m</text>
  </g>
  <g transform="translate(440, 660)">
    <rect x="0" y="0" width="130" height="42" rx="6" fill="rgba(255,82,82,0.1)" stroke="#ff525240"/>
    <text x="65" y="18" fill="#ff5252" font-size="10" font-weight="bold" text-anchor="middle">陨铁·传导晶体·锶</text>
    <text x="65" y="34" fill="#7baaaa" font-size="8" text-anchor="middle">深层区 300-400m+</text>
  </g>
</svg>
