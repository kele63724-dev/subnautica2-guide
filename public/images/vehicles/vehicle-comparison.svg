<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="800" height="480" fill="#0a1a2e" rx="8"/>
  <text x="400" y="28" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle">载具能力对比 — 《深海迷航2》</text>

  <!-- ===== 蝌蚪号 (Tadpole) ===== -->
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="220" height="410" rx="10" fill="rgba(0,180,220,0.08)" stroke="#00b4dc" stroke-width="1.5"/>
    <text x="110" y="24" fill="#00d4ff" font-size="14" font-weight="bold" text-anchor="middle">🛵 蝌蚪号 (Tadpole)</text>
    <text x="110" y="42" fill="#7baaaa" font-size="9" text-anchor="middle">单人模块化潜艇 · 主力载具</text>

    <text x="110" y="68" fill="#7baaaa" font-size="10" text-anchor="middle">速度</text>
    <rect x="30" y="74" width="160" height="10" rx="5" fill="#1a3050"/>
    <rect x="30" y="74" width="140" height="10" rx="5" fill="#00e676"/>

    <text x="110" y="108" fill="#7baaaa" font-size="10" text-anchor="middle">下潜深度</text>
    <rect x="30" y="114" width="160" height="10" rx="5" fill="#1a3050"/>
    <rect x="30" y="114" width="90" height="10" rx="5" fill="#00d4ff"/>
    <text x="200" y="124" fill="#00d4ff" font-size="9">400m+</text>

    <text x="110" y="148" fill="#7baaaa" font-size="10" text-anchor="middle">防御</text>
    <rect x="30" y="154" width="160" height="10" rx="5" fill="#1a3050"/>
    <rect x="30" y="154" width="50" height="10" rx="5" fill="#ffaa40"/>

    <text x="110" y="188" fill="#7baaaa" font-size="10" text-anchor="middle">储物</text>
    <rect x="30" y="194" width="160" height="10" rx="5" fill="#1a3050"/>
    <rect x="30" y="194" width="60" height="10" rx="5" fill="#aa88ff"/>
    <text x="200" y="204" fill="#aa88ff" font-size="9">中等</text>

    <text x="110" y="228" fill="#7baaaa" font-size="10" text-anchor="middle">模块化</text>
    <rect x="30" y="234" width="160" height="10" rx="5" fill="#1a3050"/>
    <rect x="30" y="234" width="140" height="10" rx="5" fill="#00e676"/>

    <g transform="translate(16, 260)">
      <text x="0" y="0" fill="#00e676" font-size="9">✓ 可换底盘 (侦察型/运输型)</text>
      <text x="0" y="18" fill="#00e676" font-size="9">✓ 深潜模块 (Mk.1/Mk.2)</text>
      <text x="0" y="36" fill="#00e676" font-size="9">✓ 光伏充电器</text>
      <text x="0" y="54" fill="#00e676" font-size="9">✓ 撞击装甲 / 静默推进</text>
      <text x="0" y="72" fill="#ff5252" font-size="9">✗ 基础型下潜仅 250m</text>
      <text x="0" y="90" fill="#ff5252" font-size="9">✗ 需要蝌蚪坞停放</text>
    </g>
  </g>

  <!-- ===== 水波推进器 (Wakemaker) ===== -->
  <g transform="translate(290, 50)">
    <rect x="0" y="0" width="220" height="410" rx="10" fill="rgba(0,230,118,0.06)" stroke="#00c864" stroke-width="1.5"/>
    <text x="110" y="24" fill="#00e676" font-size="14" font-weight="bold" text-anchor="middle">🏊 水波推进器</text>
    <text x="110" y="42" fill="#7baaaa" font-size="9" text-anchor="middle">可穿戴水下推进器</text>

    <text x="110" y="68" fill="#7baaaa" font-size="10" text-anchor="middle">速度</text>
    <rect x="30" y="74" width="160" height="10" rx="5" fill="#1a3050"/>
    <rect x="30" y="74" width="110" height="10" rx="5" fill="#00e676"/>

    <text x="110" y="108" fill="#7baaaa" font-size="10" text-anchor="middle">下潜深度</text>
    <rect x="30" y="114" width="160" height="10" rx="5" fill="#1a3050"/>
    <rect x="30" y="114" width="30" height="10" rx="5" fill="#ffaa40"/>
    <text x="200" y="124" fill="#ffaa40" font-size="9">自身O₂</text>

    <text x="110" y="148" fill="#7baaaa" font-size="10" text-anchor="middle">防御</text>
    <rect x="30" y="154" width="160" height="10" rx="5" fill="#1a3050"/>
    <rect x="30" y="154" width="15" height="10" rx="5" fill="#ff5252"/>

    <text x="110" y="188" fill="#7baaaa" font-size="10" text-anchor="middle">储物</text>
    <rect x="30" y="194" width="160" height="10" rx="5" fill="#1a3050"/>
    <rect x="30" y="194" width="15" height="10" rx="5" fill="#ff5252"/>

    <text x="110" y="228" fill="#7baaaa" font-size="10" text-anchor="middle">便捷性</text>
    <rect x="30" y="234" width="160" height="10" rx="5" fill="#1a3050"/>
    <rect x="30" y="234" width="150" height="10" rx="5" fill="#00e676"/>

    <g transform="translate(16, 260)">
      <text x="0" y="0" fill="#00e676" font-size="9">✓ 即刻使用无延迟</text>
      <text x="0" y="18" fill="#00e676" font-size="9">✓ 不占载具坞位</text>
      <text x="0" y="36" fill="#00e676" font-size="9">✓ 前期即可获取</text>
      <text x="0" y="54" fill="#ff5252" font-size="9">✗ 无氧气补给</text>
      <text x="0" y="72" fill="#ff5252" font-size="9">✗ 无储物空间</text>
      <text x="0" y="90" fill="#ff5252" font-size="9">✗ 无任何防护</text>
    </g>
  </g>

  <!-- ===== 潜水电梯 (Dive Elevator) ===== -->
  <g transform="translate(540, 50)">
    <rect x="0" y="0" width="220" height="410" rx="10" fill="rgba(255,170,40,0.06)" stroke="#ffaa40" stroke-width="1.5"/>
    <text x="110" y="24" fill="#ffaa40" font-size="14" font-weight="bold" text-anchor="middle">🛗 潜水电梯</text>
    <text x="110" y="42" fill="#7baaaa" font-size="9" text-anchor="middle">垂直运输平台</text>

    <text x="110" y="68" fill="#7baaaa" font-size="10" text-anchor="middle">速度</text>
    <rect x="30" y="74" width="160" height="10" rx="5" fill="#1a3050"/>
    <rect x="30" y="74" width="40" height="10" rx="5" fill="#ffaa40"/>

    <text x="110" y="108" fill="#7baaaa" font-size="10" text-anchor="middle">下潜深度</text>
    <rect x="30" y="114" width="160" height="10" rx="5" fill="#1a3050"/>
    <rect x="30" y="114" width="130" height="10" rx="5" fill="#ffaa40"/>
    <text x="200" y="124" fill="#ffaa40" font-size="9">300m+</text>

    <text x="110" y="148" fill="#7baaaa" font-size="10" text-anchor="middle">防御</text>
    <rect x="30" y="154" width="160" height="10" rx="5" fill="#1a3050"/>
    <rect x="30" y="154" width="70" height="10" rx="5" fill="#ffaa40"/>

    <text x="110" y="188" fill="#7baaaa" font-size="10" text-anchor="middle">资源运输</text>
    <rect x="30" y="194" width="160" height="10" rx="5" fill="#1a3050"/>
    <rect x="30" y="194" width="150" height="10" rx="5" fill="#00e676"/>

    <text x="110" y="228" fill="#7baaaa" font-size="10" text-anchor="middle">基地对接</text>
    <rect x="30" y="234" width="160" height="10" rx="5" fill="#1a3050"/>
    <rect x="30" y="234" width="140" height="10" rx="5" fill="#00e676"/>

    <g transform="translate(16, 260)">
      <text x="0" y="0" fill="#00e676" font-size="9">✓ 快速垂直升降</text>
      <text x="0" y="18" fill="#00e676" font-size="9">✓ 对接基地与载具</text>
      <text x="0" y="36" fill="#00e676" font-size="9">✓ 大容量资源吊装</text>
      <text x="0" y="54" fill="#ff5252" font-size="9">✗ 仅垂直方向移动</text>
      <text x="0" y="72" fill="#ff5252" font-size="9">✗ 需预先建造轨道</text>
      <text x="0" y="90" fill="#ff5252" font-size="9">✗ 建造材料成本高</text>
    </g>
  </g>
</svg>
