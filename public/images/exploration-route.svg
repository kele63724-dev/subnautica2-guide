<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="800" height="180" fill="#0a1a2e" rx="8"/>
  <text x="400" y="22" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle">推荐探索路线 — Ariadne Arm 星域</text>
  <text x="400" y="40" fill="#7baaaa" font-size="10" text-anchor="middle">抢先体验版 · 逐步深入</text>

  <!-- Step 1 -->
  <g transform="translate(15, 55)">
    <circle cx="30" cy="28" r="26" fill="rgba(0,230,150,0.15)" stroke="#00e676" stroke-width="2"/>
    <text x="30" y="34" fill="#00e676" font-size="15" font-weight="bold" text-anchor="middle">1</text>
    <text x="30" y="72" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">海藻森林</text>
    <text x="30" y="86" fill="#7baaaa" font-size="9" text-anchor="middle">0-60m</text>
    <text x="30" y="100" fill="#00e676" font-size="8" text-anchor="middle">钛·石英·铜</text>
  </g>

  <g stroke="#ffaa40" stroke-width="1.5">
    <line x1="66" y1="82" x2="105" y2="82"/>
    <polygon points="105,82 98,77 98,87" fill="#ffaa40"/>
  </g>

  <!-- Step 2 -->
  <g transform="translate(112, 55)">
    <circle cx="28" cy="28" r="26" fill="rgba(255,130,180,0.12)" stroke="#ff88aa" stroke-width="2"/>
    <text x="28" y="34" fill="#ff88aa" font-size="15" font-weight="bold" text-anchor="middle">2</text>
    <text x="28" y="72" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">珊瑚礁带</text>
    <text x="28" y="86" fill="#7baaaa" font-size="9" text-anchor="middle">0-200m</text>
    <text x="28" y="100" fill="#ff88aa" font-size="8" text-anchor="middle">银·金·硫</text>
  </g>

  <g stroke="#ffaa40" stroke-width="1.5">
    <line x1="164" y1="82" x2="203" y2="82"/>
    <polygon points="203,82 196,77 196,87" fill="#ffaa40"/>
  </g>

  <!-- Step 3 -->
  <g transform="translate(210, 55)">
    <circle cx="28" cy="28" r="26" fill="rgba(255,170,40,0.12)" stroke="#ffaa40" stroke-width="2"/>
    <text x="28" y="34" fill="#ffaa40" font-size="15" font-weight="bold" text-anchor="middle">3</text>
    <text x="28" y="72" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">热液喷口区</text>
    <text x="28" y="86" fill="#7baaaa" font-size="9" text-anchor="middle">150-300m</text>
    <text x="28" y="100" fill="#ffaa40" font-size="8" text-anchor="middle">锂·金·</text>
  </g>

  <g stroke="#ffaa40" stroke-width="1.5">
    <line x1="264" y1="82" x2="303" y2="82"/>
    <polygon points="303,82 296,77 296,87" fill="#ffaa40"/>
  </g>

  <!-- Step 4 -->
  <g transform="translate(310, 55)">
    <circle cx="28" cy="28" r="26" fill="rgba(0,180,220,0.12)" stroke="#00b4dc" stroke-width="2"/>
    <text x="28" y="34" fill="#00b4dc" font-size="15" font-weight="bold" text-anchor="middle">4</text>
    <text x="28" y="72" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">遗迹废墟</text>
    <text x="28" y="86" fill="#7baaaa" font-size="9" text-anchor="middle">200-400m</text>
    <text x="28" y="100" fill="#00b4dc" font-size="8" text-anchor="middle">天青石·蓝图</text>
  </g>

  <g stroke="#ffaa40" stroke-width="1.5">
    <line x1="364" y1="82" x2="403" y2="82"/>
    <polygon points="403,82 396,77 396,87" fill="#ffaa40"/>
  </g>

  <!-- Step 5 -->
  <g transform="translate(410, 55)">
    <circle cx="28" cy="28" r="26" fill="rgba(255,82,82,0.15)" stroke="#ff5252" stroke-width="2"/>
    <text x="28" y="34" fill="#ff5252" font-size="15" font-weight="bold" text-anchor="middle">5</text>
    <text x="28" y="72" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">稀疏平原</text>
    <text x="28" y="86" fill="#7baaaa" font-size="9" text-anchor="middle">100-300m</text>
    <text x="28" y="100" fill="#ff5252" font-size="8" text-anchor="middle">☠ 收藏家利维坦</text>
  </g>

  <g stroke="#ff5252" stroke-width="1.5">
    <line x1="464" y1="82" x2="503" y2="82"/>
    <polygon points="503,82 496,77 496,87" fill="#ff5252"/>
  </g>

  <!-- Step 6 -->
  <g transform="translate(510, 55)">
    <circle cx="28" cy="28" r="26" fill="rgba(120,200,80,0.12)" stroke="#78c840" stroke-width="2"/>
    <text x="28" y="34" fill="#78c840" font-size="15" font-weight="bold" text-anchor="middle">6</text>
    <text x="28" y="72" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">枯萎边缘</text>
    <text x="28" y="86" fill="#7baaaa" font-size="9" text-anchor="middle">250m+</text>
    <text x="28" y="100" fill="#78c840" font-size="8" text-anchor="middle">传导晶体·锶</text>
  </g>

  <!-- Legend -->
  <g transform="translate(200, 150)">
    <circle cx="5" cy="5" r="5" fill="#00e676" opacity="0.5"/>
    <text x="16" y="10" fill="#7baaaa" font-size="9">开局区</text>
    <circle cx="70" cy="5" r="5" fill="#ffaa40" opacity="0.5"/>
    <text x="81" y="10" fill="#7baaaa" font-size="9">中期</text>
    <circle cx="130" cy="5" r="5" fill="#ff5252" opacity="0.5"/>
    <text x="141" y="10" fill="#7baaaa" font-size="9">高危</text>
    <text x="195" y="10" fill="#5a8a8a" font-size="9">→ 必经路线</text>
  </g>
</svg>
