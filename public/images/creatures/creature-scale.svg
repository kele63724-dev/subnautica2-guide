<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="800" height="450" fill="#0a1a2e" rx="8"/>
  <text x="400" y="28" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle">利维坦 & 主要威胁生物体型对比</text>
  <text x="400" y="46" fill="#7baaaa" font-size="10" text-anchor="middle">抢先体验版 (EA) 已确认生物</text>

  <!-- Scale bar -->
  <g transform="translate(80, 60)">
    <line x1="0" y1="0" x2="640" y2="0" stroke="#1a4060" stroke-width="2"/>
    <text x="0" y="-6" fill="#7baaaa" font-size="9" text-anchor="middle">0m</text>
    <text x="160" y="-6" fill="#7baaaa" font-size="9" text-anchor="middle">10m</text>
    <text x="320" y="-6" fill="#7baaaa" font-size="9" text-anchor="middle">20m</text>
    <text x="480" y="-6" fill="#7baaaa" font-size="9" text-anchor="middle">40m</text>
    <text x="640" y="-6" fill="#ff5252" font-size="9" text-anchor="middle">50m+</text>
  </g>

  <!-- Player (1.8m) -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="6" height="15" rx="2" fill="#00e676"/>
    <text x="3" y="28" fill="#00e676" font-size="9" text-anchor="middle">玩家</text>
    <text x="3" y="39" fill="#5a8a8a" font-size="8" text-anchor="middle">1.8m</text>
  </g>

  <!-- 针刺者 (Needler) ~3m -->
  <g transform="translate(100, 85)">
    <rect x="0" y="0" width="12" height="24" rx="3" fill="#ff6666" opacity="0.6"/>
    <text x="6" y="38" fill="#ff6666" font-size="9" text-anchor="middle">针刺者</text>
    <text x="6" y="49" fill="#5a8a8a" font-size="8" text-anchor="middle">~3m</text>
  </g>

  <!-- 悬刺鱼 / 黑色悬刺鱼 ~5m -->
  <g transform="translate(140, 80)">
    <rect x="0" y="0" width="18" height="45" rx="4" fill="#8899cc" opacity="0.7"/>
    <text x="9" y="58" fill="#8899cc" font-size="9" text-anchor="middle">悬刺鱼</text>
    <text x="9" y="69" fill="#5a8a8a" font-size="8" text-anchor="middle">~5m</text>
  </g>

  <!-- 收藏家利维坦 50m+ -->
  <g transform="translate(220, 60)">
    <text x="80" y="-6" fill="#ff5252" font-size="11" font-weight="bold" text-anchor="middle">☠ 收藏家利维坦</text>
    <rect x="0" y="0" width="160" height="350" rx="12" fill="#cc3333" opacity="0.45" stroke="#ff5252" stroke-width="2.5"/>
    <text x="80" y="368" fill="#ff5252" font-size="10" font-weight="bold" text-anchor="middle">50m+ · 鱿鱼形态 · 4条触手</text>
    <!-- Claw marks -->
    <line x1="-25" y1="30" x2="0" y2="30" stroke="#ff5252" stroke-width="3"/>
    <line x1="-25" y1="320" x2="0" y2="320" stroke="#ff5252" stroke-width="3"/>
    <line x1="160" y1="30" x2="185" y2="30" stroke="#ff5252" stroke-width="3"/>
    <line x1="160" y1="320" x2="185" y2="320" stroke="#ff5252" stroke-width="3"/>
    <!-- AI behavior note -->
    <text x="80" y="384" fill="#ff9966" font-size="9" text-anchor="middle">实时AI · 无法击杀 · 45000单位距离脱离</text>
  </g>

  <!-- 深翼育母 -->
  <g transform="translate(440, 90)">
    <text x="60" y="-6" fill="#66ccff" font-size="10" font-weight="bold" text-anchor="middle">🕊️ 深翼育母</text>
    <rect x="0" y="0" width="120" height="120" rx="8" fill="#3366aa" opacity="0.3" stroke="#66ccff" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="60" y="136" fill="#66ccff" font-size="9" text-anchor="middle">节肢动物 · 滤食性</text>
    <text x="60" y="150" fill="#5a8a8a" font-size="8" text-anchor="middle">近水面 · 产卵</text>
  </g>

  <!-- 巨颚 -->
  <g transform="translate(580, 220)">
    <text x="55" y="-6" fill="#ffaa40" font-size="10" font-weight="bold" text-anchor="middle">🪤 巨颚 (Great Jaw)</text>
    <rect x="0" y="0" width="110" height="90" rx="8" fill="#996633" opacity="0.35" stroke="#ffaa40" stroke-width="1.5"/>
    <text x="55" y="106" fill="#ffaa40" font-size="9" text-anchor="middle">陷阱型 · 触须触发</text>
    <text x="55" y="120" fill="#5a8a8a" font-size="8" text-anchor="middle">凝灰岩塔区域</text>
  </g>

  <!-- 月鱼家族 -->
  <g transform="translate(30, 140)">
    <text x="0" y="0" fill="#00e676" font-size="9">🐟 月鱼家族</text>
    <rect x="0" y="8" width="7" height="12" rx="2" fill="#00e676" opacity="0.4"/>
    <text x="4" y="28" fill="#5a8a8a" font-size="7" text-anchor="middle">半月</text>
    <rect x="14" y="8" width="7" height="14" rx="2" fill="#4488ff" opacity="0.4"/>
    <text x="18" y="28" fill="#5a8a8a" font-size="7" text-anchor="middle">蓝月</text>
    <rect x="28" y="8" width="8" height="16" rx="2" fill="#ffaa40" opacity="0.4"/>
    <text x="32" y="28" fill="#5a8a8a" font-size="7" text-anchor="middle">满月</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 400)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#cc3333" opacity="0.6"/>
    <text x="15" y="10" fill="#7baaaa" font-size="9">攻击性利维坦</text>
    <rect x="120" y="0" width="10" height="10" rx="2" fill="#3366aa" opacity="0.4"/>
    <text x="135" y="10" fill="#7baaaa" font-size="9">滤食/被动大型生物</text>
    <rect x="280" y="0" width="10" height="10" rx="2" fill="#00e676" opacity="0.4"/>
    <text x="295" y="10" fill="#7baaaa" font-size="9">小型可食用</text>
  </g>
</svg>
